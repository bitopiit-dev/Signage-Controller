publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.0.0
  shelf: ^1.4.1
  shelf_static: ^1.1.2
  file_picker: ^8.1.2
  path: ^1.9.0
  desktop_drop: ^0.5.0
  path_provider: ^2.1.2
  video_player: ^2.8.2
